<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tahoo Ga</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- START -->
  <div id="start" class="card-box">
    <h1 class="title">Tahoo Ga</h1>

    <input type="text" id="nickname" placeholder="Nama kamu siapaa" class="input-name">

    <button onclick="startQuiz()" class="btn-start">Mulai</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden card-box">
    <h2 id="question" class="question"></h2>

    <div class="answers">
      <div class="card" onclick="checkAnswer(0, this)"></div>
      <div class="card" onclick="checkAnswer(1, this)"></div>
      <div class="card" onclick="checkAnswer(2, this)"></div>
      <div class="card" onclick="checkAnswer(3, this)"></div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="hidden card-box">
    <h2 id="hasil" class="result-text"></h2>
    <button onclick="location.reload()" class="btn-start">Main Lagi</button>
  </div>

</div>

<!-- SOUND -->
<audio id="soundBenar" src="benar.mp3"></audio>
<audio id="soundSalah" src="salah.mp3"></audio>

<script>
let nickname = "";
let currentQuestion = 0;
let score = 0;
let answered = false;

const questions = [
  {
    question: "Ibukota Indonesia?",
    options: ["Bandung","Jakarta","Medan","Bali"],
    answer: 1
  },
  {
    question: "2 + 2 = ?",
    options: ["3","4","5","6"],
    answer: 1
  },
  {
    question: "Planet terbesar?",
    options: ["Mars","Bumi","Jupiter","Venus"],
    answer: 2
  },
  {
    question: "Air mendidih pada?",
    options: ["50°C","100°C","80°C","120°C"],
    answer: 1
  },
  {
    question: "Nama Lengkap humai",
    options: ["Humaira Biya Naren","Humaira Bahiya Narendra","Humairah Bahiya Narendra","Humayra Baiya Naren"],
    answer: 1
  },
];

function startQuiz() {
  nickname = document.getElementById("nickname").value;

  if (nickname === "") {
    alert("Isi dulu namanya");
    return;
  }

  document.getElementById("start").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  loadQuestion();
}

function loadQuestion() {
  answered = false;

  let q = questions[currentQuestion];
  document.getElementById("question").innerText = q.question;

  let cards = document.querySelectorAll(".card");

  cards.forEach((card, i) => {
    card.innerHTML = `<div class="inner">${q.options[i]}</div>`;
    card.classList.remove("correct","wrong","flip");
    card.style.pointerEvents = "auto";
  });
}

function checkAnswer(index, el) {
  if (answered) return;

  answered = true;

  let correct = questions[currentQuestion].answer;
  let cards = document.querySelectorAll(".card");

  cards.forEach(c => c.style.pointerEvents = "none");

  if (index === correct) {
    el.classList.add("correct","flip");
    el.innerHTML = "<div class='inner'>BENAR</div>";
    score += 10;

    let s = document.getElementById("soundBenar");
    s.currentTime = 0;
    s.play();
  } else {
    el.classList.add("wrong","flip");
    el.innerHTML = "<div class='inner'>SALAH</div>";

    let s = document.getElementById("soundSalah");
    s.currentTime = 0;
    s.play();
  }

  setTimeout(() => {
    currentQuestion++;

    if (currentQuestion < questions.length) {
      loadQuestion();
    } else {
      showResult();
    }
  }, 1000);
}

function showResult() {
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("hasil").innerText =
    nickname + " | Skor: " + score;
}
</script>

</body>
</html>
